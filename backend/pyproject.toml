[project]
name = "historai-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "groq",
    "google-genai",
    "python-dotenv",
    "pydantic",
    "supabase",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "models", "routers"]
